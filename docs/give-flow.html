<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giving recognition</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f4f5f5;
      --color-ink:    #002a2d;
      --color-muted:  #04646a;
      --color-accent: #f5532d;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-title:   'Poppins', system-ui, sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .lede { font-size: 0.95rem; color: var(--color-muted); max-width: 64ch; margin-bottom: 1.5rem; line-height: 1.5; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Sequence · HeyBitovi</p>
    <h1>Giving recognition</h1>
    <p class="lede"><code>/heybitovi give @user :egg: reason</code> from anywhere. Within the daily cap the bot posts to #general (threaded per recipient per day), posts a copy where the give ran, and DMs the giver. Over the cap, only the giver sees a private reply.</p>
