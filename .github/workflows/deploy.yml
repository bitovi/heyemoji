name: Test, build, and deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: [test]
    uses: bitovi/platform-ci/.github/workflows/container-build.yml@0.0.1
    permissions:
      id-token: write
      contents: write
      actions: write
    with:
      values-file: deploy/values.yaml
      image-tag-path: .workloads.main.image.tag
      image-tag: ${{ github.ref_name }}
      deploy-branch: "main"
      writeback-app-id: ${{ vars.CI_WRITEBACK_APP_ID }}
      environment-label: release
    secrets: inherit

  notify:
    name: Slack Notification
    needs: [test, release]
    if: always()
    uses: ./.github/workflows/slack-notification.yml
    with:
      status: ${{ (needs.test.result == 'success' && needs.release.result == 'success') && 'success' || 'failure' }}
      service_name: "heyemoji"
      environment: production
      title: ${{ (needs.test.result == 'success' && needs.release.result == 'success') && 'release deployed' || 'release failed' }}
      detail: "Tag: ${{ github.ref_name }}"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.BITOVI_PLATFORM_SLACK_WEBHOOK_URL }}
